---
# SecretStore configures how External Secrets Operator connects to Vault
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: personal-finance
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        # Use Kubernetes authentication
        kubernetes:
          mountPath: "kubernetes"
          role: "personal-finance"
          serviceAccountRef:
            name: "vault-auth"
