---
# ExternalSecret syncs secrets from Vault to Kubernetes
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-secret-from-vault
  namespace: personal-finance
spec:
  # Refresh interval - how often to sync from Vault
  refreshInterval: 1m

  # Reference to the SecretStore
  secretStoreRef:
    name: vault-backend
    kind: SecretStore

  # Target Kubernetes secret to create/update
  target:
    name: postgres-secret
    creationPolicy: Owner
    deletionPolicy: Retain

  # Data to sync from Vault
  data:
  - secretKey: POSTGRES_DB
    remoteRef:
      key: personal-finance/postgres
      property: POSTGRES_DB

  - secretKey: POSTGRES_USER
    remoteRef:
      key: personal-finance/postgres
      property: POSTGRES_USER

  - secretKey: POSTGRES_PASSWORD
    remoteRef:
      key: personal-finance/postgres
      property: POSTGRES_PASSWORD

  - secretKey: DATABASE_URL
    remoteRef:
      key: personal-finance/postgres
      property: DATABASE_URL
