---
# Network Policy for PostgreSQL Database
# Restricts inbound connections to only authorized services
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-network-policy
  namespace: personal-finance
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow connections from ETL service
  - from:
    - podSelector:
        matchLabels:
          app: etl-service
    ports:
    - protocol: TCP
      port: 5432
  # Allow connections from MCP server
  - from:
    - podSelector:
        matchLabels:
          app: personal-finance-mcp
    ports:
    - protocol: TCP
      port: 5432
  # Allow connections from migration jobs
  - from:
    - podSelector:
        matchLabels:
          job-name: db-migrations
    ports:
    - protocol: TCP
      port: 5432
  # Allow connections from backup jobs
  - from:
    - podSelector:
        matchLabels:
          app: postgres-backup
    ports:
    - protocol: TCP
      port: 5432
  egress:
  # Allow DNS queries
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
  # Allow outbound connections (for replication if needed)
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
