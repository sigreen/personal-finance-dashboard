---
# Network Policy for Frontend
# Frontend is public-facing, but we still restrict egress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-network-policy
  namespace: personal-finance
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow all inbound traffic (frontend is public)
  - {}
  egress:
  # Allow DNS queries
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
  # Allow connections to ETL service API
  - to:
    - podSelector:
        matchLabels:
          app: etl-service
    ports:
    - protocol: TCP
      port: 8080
  # Allow connections to Keycloak for authentication
  - to:
    - namespaceSelector:
        matchLabels:
          name: keycloak
      podSelector:
        matchLabels:
          app: keycloak
    ports:
    - protocol: TCP
      port: 8080
