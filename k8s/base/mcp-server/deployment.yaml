---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-server-config
data:
  HOST: "0.0.0.0"
  PORT: "8081"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: personal-finance-mcp
  annotations:
    kagenti.io/description: "Personal Finance MCP Server with 8 tools for account management, transactions, and analytics"
  labels:
    app.kubernetes.io/managed-by: kagenti-ui
    app.kubernetes.io/name: personal-finance-mcp
    kagenti.io/type: tool
    kagenti.io/protocol: mcp
    kagenti.io/transport: streamable_http
    kagenti.io/framework: Python
    kagenti.io/inject: disabled
    kagenti.io/workload-type: deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: personal-finance-mcp
      kagenti.io/type: tool
  template:
    metadata:
      labels:
        app.kubernetes.io/name: personal-finance-mcp
        kagenti.io/type: tool
        kagenti.io/protocol: mcp
        kagenti.io/transport: streamable_http
        kagenti.io/framework: Python
    spec:
      containers:
      - name: mcp
        image: localhost:5555/finance-mcp:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8081
          name: http
          protocol: TCP
        env:
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "8081"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: DATABASE_URL
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector.kagenti-system.svc.cluster.local:8335"
        - name: KEYCLOAK_URL
          value: "http://keycloak.keycloak.svc.cluster.local:8080"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsUser: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: personal-finance-mcp-mcp
  labels:
    app.kubernetes.io/managed-by: kagenti-ui
    app.kubernetes.io/name: personal-finance-mcp
    kagenti.io/type: tool
    kagenti.io/protocol: mcp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: personal-finance-mcp
    kagenti.io/type: tool
  ports:
  - name: http
    port: 8000
    targetPort: 8081
    protocol: TCP
