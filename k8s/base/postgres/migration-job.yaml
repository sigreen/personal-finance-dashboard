apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-migration
  namespace: default
spec:
  template:
    metadata:
      labels:
        app: postgres-migration
    spec:
      restartPolicy: OnFailure
      containers:
      - name: migration
        image: localhost/finance-db-migration:latest
        imagePullPolicy: Never  # Use local image loaded into minikube
        env:
        - name: DB_HOST
          value: "postgres"
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
  backoffLimit: 3
