apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: personal-finance-mcp-public
  namespace: personal-finance
spec:
  parentRefs:
  - name: http
    namespace: kagenti-system
  hostnames:
  - "finance-mcp.localtest.me"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: personal-finance-mcp-mcp
      port: 8000
