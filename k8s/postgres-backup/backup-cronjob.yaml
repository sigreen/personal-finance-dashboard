---
# Personal Finance Database Backup CronJob
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: personal-finance
spec:
  schedule: "0 2 * * *"  # Daily at 2 AM
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: postgres-backup
        spec:
          restartPolicy: OnFailure
          containers:
          - name: backup
            image: postgres:15-alpine
            env:
            - name: PGHOST
              value: "postgres.personal-finance.svc.cluster.local"
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: BACKUP_RETENTION_DAYS
              value: "30"
            command:
            - /bin/sh
            - -c
            - |
              set -e
              BACKUP_DIR="/backups"
              TIMESTAMP=$(date +%Y%m%d_%H%M%S)
              BACKUP_FILE="${BACKUP_DIR}/finance_db_${TIMESTAMP}.sql.gz"

              echo "Starting backup at $(date)"
              echo "Backing up database: ${PGDATABASE}"

              # Create backup with compression
              pg_dump -Fc -Z 9 -f "${BACKUP_FILE}" || {
                echo "Backup failed!"
                exit 1
              }

              # Verify backup file exists and has content
              if [ ! -s "${BACKUP_FILE}" ]; then
                echo "Backup file is empty or missing!"
                exit 1
              fi

              BACKUP_SIZE=$(du -h "${BACKUP_FILE}" | cut -f1)
              echo "Backup completed successfully: ${BACKUP_FILE} (${BACKUP_SIZE})"

              # Clean up old backups (keep last 30 days)
              find ${BACKUP_DIR} -name "finance_db_*.sql.gz" -type f -mtime +${BACKUP_RETENTION_DAYS} -delete

              echo "Backup retention: keeping last ${BACKUP_RETENTION_DAYS} days"
              echo "Current backups:"
              ls -lh ${BACKUP_DIR}/finance_db_*.sql.gz 2>/dev/null || echo "No previous backups found"

              echo "Backup job completed at $(date)"
            volumeMounts:
            - name: backup-storage
              mountPath: /backups
            resources:
              requests:
                memory: "256Mi"
                cpu: "100m"
              limits:
                memory: "512Mi"
                cpu: "500m"
          volumes:
          - name: backup-storage
            persistentVolumeClaim:
              claimName: postgres-backup-storage
