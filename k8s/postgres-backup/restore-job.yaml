---
# Manual Restore Job (run with: kubectl create -f restore-job.yaml)
# Before running:
# 1. Update RESTORE_FILE to the backup you want to restore
# 2. Consider scaling down applications that use the database
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-restore
  namespace: personal-finance
spec:
  ttlSecondsAfterFinished: 86400  # Keep for 24 hours after completion
  template:
    metadata:
      labels:
        app: postgres-restore
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
      - name: restore
        image: postgres:15-alpine
        env:
        - name: PGHOST
          value: "postgres.personal-finance.svc.cluster.local"
        - name: PGPORT
          value: "5432"
        - name: PGDATABASE
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_DB
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: RESTORE_FILE
          # Update this to the backup file you want to restore
          value: "finance_db_YYYYMMDD_HHMMSS.dump"
        command:
        - /bin/sh
        - -c
        - |
          set -e
          BACKUP_DIR="/backups"
          RESTORE_PATH="${BACKUP_DIR}/${RESTORE_FILE}"

          echo "========================================="
          echo "PostgreSQL Database Restore"
          echo "========================================="
          echo "Timestamp: $(date)"
          echo "Database: ${PGDATABASE}"
          echo "Host: ${PGHOST}"
          echo "Restore file: ${RESTORE_PATH}"
          echo "========================================="

          # Check if backup file exists
          if [ ! -f "${RESTORE_PATH}" ]; then
            echo "ERROR: Backup file not found: ${RESTORE_PATH}"
            echo "Available backups:"
            ls -lh ${BACKUP_DIR}/finance_db_*.dump 2>/dev/null || echo "No backups found"
            exit 1
          fi

          # Wait for database to be ready
          until pg_isready -h ${PGHOST} -U ${PGUSER} -d ${PGDATABASE}; do
            echo "Waiting for database to be ready..."
            sleep 2
          done

          echo "========================================="
          echo "WARNING: This will overwrite the current database!"
          echo "Press Ctrl+C within 10 seconds to cancel..."
          echo "========================================="
          sleep 10

          # Drop existing connections
          echo "Terminating existing database connections..."
          psql -h ${PGHOST} -U ${PGUSER} -d postgres -c "
            SELECT pg_terminate_backend(pg_stat_activity.pid)
            FROM pg_stat_activity
            WHERE pg_stat_activity.datname = '${PGDATABASE}'
              AND pid <> pg_backend_pid();"

          # Restore the database
          echo "Starting restore from ${RESTORE_FILE}..."
          pg_restore -h ${PGHOST} -U ${PGUSER} -d ${PGDATABASE} --clean --if-exists --verbose "${RESTORE_PATH}" 2>&1 || {
            echo "ERROR: Restore failed!"
            exit 1
          }

          echo "========================================="
          echo "Database restore completed successfully"
          echo "Timestamp: $(date)"
          echo "========================================="
        volumeMounts:
        - name: backup-storage
          mountPath: /backups
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
      volumes:
      - name: backup-storage
        persistentVolumeClaim:
          claimName: postgres-backup-storage
