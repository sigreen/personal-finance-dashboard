[project]
name = "personal-finance-agent"
version = "0.0.1"
description = "Personal Finance Agent - A LangGraph-based A2A agent for analyzing financial data using MCP tools"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Personal Finance Dashboard Team" }
]
license = { text = "Apache-2.0" }
dependencies = [
    "a2a-sdk>=0.2.16",
    "langgraph>=0.2.55",
    "langchain-community>=0.3.9",
    "langchain-ollama>=0.2.1",
    "langchain-openai>=0.3.7",
    "openinference-instrumentation-langchain>=0.1.36",
    "pydantic-settings>=2.8.1",
    "langchain-mcp-adapters>=0.1.0",
    "python-keycloak>=5.5.1",
    "opentelemetry-exporter-otlp",
]

[project.scripts]
server = "personal_finance_agent.agent:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"